name: Bug report
description: Report a reproducible problem with Zotero OneDrive Organizer
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please test with a disposable item/folder when possible. Do not include credentials or private document contents.
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version
      placeholder: "10.0.4"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.7"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Destination type
      description: OneDrive, Dropbox, NAS, local folder, etc.
      placeholder: "OneDrive local sync folder"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → OneDrive Organizer
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error message
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Relevant Zotero Debug Output
      description: Redact private paths or document information if necessary.
      render: text
