name: build-xpi

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build XPI
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-onedrive-organizer-xpi
          path: dist/*.xpi
