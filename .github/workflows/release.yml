name: release-xpi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify tag matches manifest version
        run: >-
          python -c 'import json, os; v=json.load(open("manifest.json", encoding="utf-8"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v, "tag %s != manifest v%s" % (os.environ["GITHUB_REF_NAME"], v)'
      - name: Build XPI
        run: python scripts/build.py
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xpi
          generate_release_notes: true
