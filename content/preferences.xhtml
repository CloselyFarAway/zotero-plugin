<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <hbox align="center">
      <label><html:h2>Zotero OneDrive Organizer</html:h2></label>
      <spacer flex="1" />
      <label id="zoo-version" value="v0.1.8" />
    </hbox>
    <description>
      Move stored PDFs from My Library into a OneDrive/external folder and keep them in Zotero as linked files.
    </description>
    <description>
      Recommended first run: Browse → Check folder → Preview selected path(s) → Organize selected item(s).
    </description>

    <checkbox id="zoo-auto-enabled"
              preference="extensions.zotero-onedrive-organizer.autoEnabled"
              label="Automatically organize newly added stored PDFs (off by default for safety)" />

    <separator class="thin" />

    <label value="OneDrive / external root folder" />
    <hbox align="center">
      <html:input id="zoo-base-dir"
                  type="text"
                  preference="extensions.zotero-onedrive-organizer.baseDir"
                  style="min-width: 36em; flex: 1;" />
      <button id="zoo-browse" label="Browse…" />
      <button id="zoo-check-folder" label="Check folder" />
    </hbox>
    <description>
      Check folder verifies that the path exists and that Zotero can create and remove a temporary file there.
    </description>

    <separator class="thin" />

    <checkbox id="zoo-library-folder"
              preference="extensions.zotero-onedrive-organizer.includeLibraryFolder"
              label="Include library folder (for example: My Library)" />
    <checkbox id="zoo-collection-path"
              preference="extensions.zotero-onedrive-organizer.includeCollectionPath"
              label="Mirror collection/subcollection path" />
    <checkbox id="zoo-year-folder"
              preference="extensions.zotero-onedrive-organizer.includeYearFolder"
              label="Add publication year as a folder" />

    <hbox align="center">
      <label value="Folder name for items not in a collection:" />
      <html:input id="zoo-unfiled"
                  type="text"
                  preference="extensions.zotero-onedrive-organizer.unfiledFolder"
                  style="width: 14em;" />
    </hbox>

    <separator class="thin" />

    <label value="Filename template" />
    <html:input id="zoo-template"
                type="text"
                preference="extensions.zotero-onedrive-organizer.filenameTemplate"
                style="min-width: 36em;" />
    <description>
      Tokens: {firstCreator}, {year}, {title}, {itemKey}, {attachmentKey}
    </description>

    <checkbox id="zoo-relative-paths"
              preference="extensions.zotero-onedrive-organizer.useRelativePaths"
              label="Use Zotero relative linked-file paths when safe (useful across multiple computers)" />
    <description>
      This will set Zotero's linked-attachment base directory only if no conflicting base directory already exists.
    </description>

    <separator />

    <hbox align="center">
      <button id="zoo-preview-selected" label="Preview selected path(s)…" />
      <button id="zoo-organize-selected" label="Organize selected item(s)" />
      <button id="zoo-organize-existing" label="Organize ALL existing PDFs…" />
      <button id="zoo-cancel-existing" label="Cancel bulk" disabled="true" />
    </hbox>
    <label id="zoo-status" value="" style="margin-top: 0.5em;" />
    <description>Bulk cancellation is cooperative: the current PDF finishes safely, then the migration stops.</description>

    <separator class="thin" />
    <hbox align="center">
      <button id="zoo-project-page" label="Project page" />
      <button id="zoo-report-issue" label="Report a bug / request a feature" />
    </hbox>

    <separator class="thin" />
    <description style="color: var(--fill-quinary);">
      Important: Zotero linked files are supported only in My Library, not Group Libraries. This plugin skips Group Library attachments.
    </description>
  </groupbox>
</vbox>
